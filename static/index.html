<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Silky Sentinel Dashboard</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="navbar-brand">Silky Sentinel Dashboard</div>
  </header>

  <main class="layout">
    <section class="panel" id="cluster-overview">
      <div class="panel-header">
        <h2>Cluster Overview</h2>
      </div>

      <div class="card-grid">
        <article class="card" id="card-total-pods">
          <p class="label">Total Pods</p>
          <p class="value" id="total-pods">0</p>
        </article>
        <article class="card" id="card-bad-pods">
          <p class="label">Bad Pods</p>
          <p class="value" id="bad-pods">0</p>
        </article>
        <article class="card" id="card-last-severity">
          <p class="label">Last Severity</p>
          <p class="value" id="last-severity">—</p>
        </article>
      </div>

      <div class="table-container">
        <table class="pods-table">
          <thead>
            <tr>
              <th>Namespace</th>
              <th>Name</th>
              <th>Status</th>
              <th>Restarts</th>
            </tr>
          </thead>
          <tbody id="pods-table-body">
            <!-- Populated by /static/app.js -->
          </tbody>
        </table>
      </div>
    </section>

    <section class="panel" id="night-mode">
      <div class="panel-header">
        <h2>Night Mode</h2>
      </div>

      <div class="night-status">
        <span class="status-indicator stopped" aria-hidden="true" id="night-status-indicator"></span>
        <div class="status-text">
          <p class="label">Status</p>
          <p class="value" id="night-status-text">Stopped</p>
        </div>
      </div>

      <div class="night-actions">
        <button type="button" id="btn-night-start" data-endpoint="/api/night/start">Start Night Shift</button>
        <button type="button" class="secondary" id="btn-night-stop" data-endpoint="/api/night/stop">Stop Night Shift</button>
      </div>

      <div class="night-events">
        <h3>Latest Night Mode Events</h3>
        <div class="events-log" id="night-events-log" aria-live="polite">
          <!-- Night mode events will render here -->
        </div>
      </div>

      <div class="night-reports">
        <h3>Night Mode Reports</h3>
        <div class="report-controls">
          <label for="night-report-select" class="sr-only">Available reports</label>
          <select id="night-report-select">
            <option value="">Select a report…</option>
          </select>
          <button type="button" id="btn-view-report">View Report</button>
        </div>
        <pre class="report-viewer" id="night-report-viewer" aria-live="polite">Choose a report to view its details.</pre>
      </div>
    </section>

    <section class="panel" id="chat-console">
      <div class="panel-header">
        <h2>Chat Console</h2>
      </div>

      <form class="chat-form" id="chat-form" data-endpoint="/api/chat">
        <label for="chat-message">Message</label>
        <textarea id="chat-message" name="message" rows="4" placeholder="Ask Silky Sentinel..."></textarea>
        <div class="chat-actions">
          <button type="button" id="btn-chat-send">Send</button>
        </div>
      </form>

      <div class="chat-response">
        <h3>Assistant Response</h3>
        <div class="response-box" id="chat-response-text"></div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
